<!-- Expandable Email Login Form Box -->
<div class="hidden flex-col gap-3.5 transition-all duration-300 ease-out" id="email-form-container">

<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px]">mail</span>
<input class="w-full h-[52px] pl-12 pr-4 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md focus:outline-none focus:bg-surface-container-low transition-colors" id="user-email" placeholder="tennis@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">

        <button class="text-on-surface underline underline-offset-2 font-medium" type="button">이용약관</button> 및 
        <button class="text-on-surface underline underline-offset-2 font-medium" type="button">개인정보처리방침</button>에 
        동의하게 됩니다.
      </p>
</div>
</div>
</div>
<script>
  // Email Accordion micro-interaction
  const toggleBtn = document.getElementById('toggle-email-btn');
  const emailContainer = document.getElementById('email-form-container');
  const chevron = document.getElementById('chevron-icon');

  if (toggleBtn && emailContainer) {
    toggleBtn.addEventListener('click', () => {
      const isHidden = emailContainer.classList.contains('hidden');
      if (isHidden) {
        emailContainer.classList.remove('hidden');
        emailContainer.classList.add('flex');
        chevron.style.transform = 'rotate(180deg)';
        emailContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        emailContainer.classList.add('hidden');
        emailContainer.classList.remove('flex');
        chevron.style.transform = 'rotate(0deg)';
      }
    });
  }

  // Password visibility toggle
  const pwdInput = document.getElementById('user-password');
  const togglePwdBtn = document.getElementById('toggle-pwd-vis');
  const pwdIcon = document.getElementById('pwd-icon');

  if (togglePwdBtn && pwdInput && pwdIcon) {
    togglePwdBtn.addEventListener('click', () => {
      const isPassword = pwdInput.getAttribute('type') === 'password';
      pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
      pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }
</script></main></body></html>
