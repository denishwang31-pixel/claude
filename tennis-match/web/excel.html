<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Court 대회 엑셀</title>
<!--
  엑셀 작업 링크 — /excel?c=클럽&j=일감 (2026-10-17)

  앱 주인: "앱 등록용 빌드 말고 지금 깔린 앱에서 쓰게". 휴대폰 앱에는 파일을 고르고 보내는 기능이 아직 없어서
  파일은 이 페이지(PC·휴대폰 브라우저)에서 다룬다. 앱의 대회 화면 → 엑셀로 불러오기 → [엑셀 작업 링크 만들기]가 이 주소를 보낸다.
    · [양식 내려받기]  앱이 지금 대회 내용으로 채워 둔 .xlsx
    · [올리기]         고친 .xlsx 를 서버(/api/excel)로 — 서버는 칸 값만 적고, 대회는 앱에서 운영진이 저장해야 바뀐다
  ⚠️ 회원 이름을 이 페이지에 그리지 않는다(링크가 남에게 가도 이름 목록이 화면에 안 보이게). 파일 안에는 있다.
  ⚠️ 외부 글꼴·라이브러리를 안 쓴다(카톡 안 브라우저에서도 바로 뜨게).
-->
<style>
  :root { --green: #0E6B4F; --green2: #10B981; --soft: #E8F8F2; --ink: #0F172A; --sub: #475569; --faint: #94A3B8; --line: #E2E8F0; --bg: #F8FAFC; --no: #B91C1C; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; -webkit-text-size-adjust: 100%; word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .hero { background: var(--green); color: #fff; border-radius: 20px; padding: 22px 20px; }
  .hero small { color: #BEF264; font-weight: 800; letter-spacing: .08em; }
  .hero h1 { margin: 6px 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  .hero p { margin: 0; color: #CDEBDD; font-size: 14px; line-height: 1.6; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .card p { font-size: 14px; color: var(--sub); line-height: 1.6; margin: 0; }
  .btn { display: block; width: 100%; text-align: center; text-decoration: none; font: inherit; font-size: 16px; font-weight: 800;
    padding: 14px; border-radius: 14px; background: var(--green); color: #fff; margin-top: 12px; border: 0; cursor: pointer; }
  .btn.light { background: #BEF264; color: var(--ink); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .file { display: block; width: 100%; margin-top: 12px; font: inherit; font-size: 14px; padding: 12px; border: 1.5px dashed var(--faint); border-radius: 12px; background: var(--bg); }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .msg.ok { background: var(--soft); color: var(--green); font-weight: 700; }
  .msg.err { background: #FEF2F2; color: var(--no); }
  .note { font-size: 12.5px; color: var(--faint); line-height: 1.6; margin-top: 8px; }
  .foot { font-size: 12px; color: var(--faint); text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <small>COURT</small>
    <h1 id="title">대회 엑셀</h1>
    <p>참가자·팀·대진을 엑셀로 고쳐 앱에 올립니다.</p>
  </div>

  <div class="msg err" id="bad" hidden></div>

  <div id="main" hidden>
    <div class="card">
      <h2>① 양식 내려받기</h2>
      <p>지금 대회 내용이 채워진 엑셀 파일입니다. 엑셀에서 고친 뒤 <b>Excel 통합 문서(.xlsx)</b>로 저장하세요.</p>
      <a class="btn light" id="dl" href="#">양식 내려받기 (.xlsx)</a>
      <p class="note">시트 이름(참가자·대진)과 첫 줄 제목은 바꾸지 마세요. 쓰는 법은 파일의 「안내」 시트에 있습니다.</p>
    </div>

    <div class="card">
      <h2>② 고친 파일 올리기</h2>
      <p>올리면 앱에 미리 보기가 뜹니다. 대회는 앱에서 <b>[이대로 저장]</b>을 눌러야 바뀝니다.</p>
      <input class="file" type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <button class="btn" id="up" disabled>올리기</button>
      <div class="msg" id="res" hidden></div>
    </div>
    <p class="note" id="exp"></p>
  </div>

  <p class="foot">Court · 테니스 클럽 운영 앱</p>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var c = q.get('c') || '', j = q.get('j') || '';
  var api = '/api/excel?c=' + encodeURIComponent(c) + '&j=' + encodeURIComponent(j);
  var $ = function (id) { return document.getElementById(id); };
  var bad = function (m) { $('bad').textContent = m; $('bad').hidden = false; $('main').hidden = true; };
  var show = function (ok, m) { var r = $('res'); r.className = 'msg ' + (ok ? 'ok' : 'err'); r.textContent = m; r.hidden = false; };
  if (!c || !j) { bad('링크 주소가 잘못되었습니다. 앱에서 새 링크를 만들어 주세요.'); return; }

  fetch(api, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { bad(d.message || '링크를 열지 못했습니다.'); return; }
    if (d.name) { $('title').textContent = d.name; document.title = d.name + ' · Court 엑셀'; }
    $('dl').href = api + '&file=template';
    if (d.expiresAt) {
      var t = new Date(d.expiresAt);
      $('exp').textContent = '이 링크는 ' + t.getHours() + '시 ' + String(t.getMinutes()).padStart(2, '0') + '분까지 쓸 수 있습니다.';
    }
    if (d.uploads) show(true, '이미 ' + d.uploads + '번 올렸습니다. 다시 올리면 앱의 미리 보기가 새 파일로 바뀝니다.');
    $('main').hidden = false;
  }).catch(function () { bad('연결이 불안정합니다. 잠시 후 다시 열어 주세요.'); });

  $('file').addEventListener('change', function () { $('up').disabled = !$('file').files.length; $('res').hidden = true; });
  $('up').addEventListener('click', function () {
    var f = $('file').files[0];
    if (!f) return;
    if (!/\.xlsx$/i.test(f.name)) { show(false, '.xlsx 파일만 올릴 수 있습니다. 엑셀에서 「Excel 통합 문서(.xlsx)」로 저장해 주세요.'); return; }
    if (f.size > 2 * 1024 * 1024) { show(false, '파일이 너무 큽니다(2MB까지).'); return; }
    $('up').disabled = true; $('up').textContent = '올리는 중…';
    fetch(api, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', 'X-File-Name': encodeURIComponent(f.name) }, body: f })
      .then(function (r) { return r.json(); })
      .then(function (d) { show(!!d.ok, d.message || (d.ok ? '올렸습니다.' : '올리지 못했습니다.')); })
      .catch(function () { show(false, '연결이 불안정합니다. 다시 올려 주세요.'); })
      .then(function () { $('up').disabled = false; $('up').textContent = '올리기'; });
  });
})();
</script>
</body>
</html>
