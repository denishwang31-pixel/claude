<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>대진표·실시간 순위 — Court</title>
<!--
  대회 외부 공개 페이지 — /live?c=클럽&t=대회

  운영진이 앱에서 [외부 공개 링크]를 켜고 보낸 주소. 청백전(2팀·3팀)·팀 리그는 팀 점수판·타임별 대진. 앱이 없는 외부 참가자·
  관중이 카톡 안 브라우저로 연다. 서버 함수 liveTournament(/api/live)가
  공개된 대회만, 이름·조·시간표·결과·순위만 돌려준다.

  ⚠️ 30초마다 다시 읽는다 — 결과가 들어오면 순위가 저절로 바뀐다.
  ⚠️ 외부 글꼴·라이브러리를 안 쓴다(느린 망에서도 바로 뜨게). 읽기 전용.
-->
<style>
  :root {
    --green: #0E6B4F; --green2: #10B981; --green-soft: #E8F8F2; --ink: #0F172A; --sub: #475569;
    --faint: #94A3B8; --line: #E2E8F0; --fill: #F1F5F9; --bg: #F8FAFC; --card: #FFFFFF; --no: #B91C1C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  .club { font-size: 13px; font-weight: 700; color: var(--green); }
  h1 { font-size: 22px; margin: 4px 0 4px; letter-spacing: -0.02em; }
  .meta { font-size: 13px; color: var(--sub); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); margin-top: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--green2); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 16px 0 4px; padding-bottom: 4px; }
  .tab { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--sub); white-space: nowrap; cursor: pointer; }
  .tab.on { background: var(--green); border-color: var(--green); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
  .card h2 { font-size: 17px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { font-size: 12px; color: var(--faint); font-weight: 700; padding: 6px 2px; border-bottom: 1px solid var(--line); text-align: center; }
  th.l, td.l { text-align: left; }
  td { padding: 8px 2px; border-bottom: 1px solid var(--fill); text-align: center; }
  .rk { display: inline-block; min-width: 22px; padding: 2px 5px; border-radius: 11px; background: var(--fill); font-size: 12px; font-weight: 800; color: var(--sub); }
  .rk.up { background: var(--green); color: #fff; }
  .w { color: var(--green); font-weight: 800; }
  .plus { color: var(--green2); font-weight: 700; } .minus { color: var(--no); font-weight: 700; }
  .note { font-size: 12px; color: var(--faint); margin-top: 8px; line-height: 1.5; }
  .m { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--fill); }
  .m:first-child { border-top: 0; }
  .when { width: 58px; font-size: 12px; color: var(--green); font-weight: 800; }
  .when span { display: block; color: var(--faint); font-weight: 500; }
  .teams { flex: 1; font-size: 14px; line-height: 1.5; }
  .teams .win { color: var(--green); font-weight: 800; }
  .sc { font-size: 16px; font-weight: 800; }
  .sc.wait { font-size: 12px; color: var(--faint); font-weight: 600; }
  /* 청백전·팀 리그 — 팀 점수판 · 타임별 대진 */
  .tp { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 12px; font-weight: 800; color: #fff; border: 1.5px solid transparent; }
  .tp.white { background: #fff !important; color: #111827; border-color: #111827; }
  .board { display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--ink); color: #fff; border-radius: 16px; padding: 16px; margin-top: 14px; }
  .board .side { text-align: center; min-width: 90px; }
  .board .side b { display: block; font-size: 40px; line-height: 1.1; }
  .board .side.lead b { color: #A3E635; }
  .board .colon { font-size: 22px; opacity: .5; }
  .rnd { font-size: 13px; font-weight: 800; color: var(--green); margin: 10px 0 2px; }
  .tm { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--fill); }
  .tm .ct { width: 54px; font-size: 12px; color: var(--sub); font-weight: 700; }
  .tm .ct span { display: block; color: var(--faint); font-weight: 600; font-size: 11px; }
  .tm .sides { flex: 1; font-size: 13.5px; line-height: 1.7; }
  .tm .sides .win { color: var(--green); font-weight: 800; }
  .sum { font-size: 13px; color: var(--sub); margin-top: 6px; }
  /* 대진표 — 앱의 MatchGrid 와 같은 모양(가로 = 코트, 세로 = 타임). 좁은 화면은 가로로 민다 */
  .gscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px -4px 0; padding: 0 4px 4px; }
  table.grid { border-collapse: separate; border-spacing: 0; width: auto; font-size: 12px; }
  table.grid th { background: var(--ink); color: #BEF264; font-size: 12px; padding: 7px 4px; border: 0; min-width: 138px; }
  table.grid th:first-child { min-width: 42px; background: transparent; }
  table.grid th.c1 { border-top-left-radius: 10px; } table.grid th.cl { border-top-right-radius: 10px; }
  table.grid td { border: 1px solid #F1F5F9; padding: 6px; vertical-align: top; text-align: center; background: #fff; }
  table.grid td.r { background: var(--green); color: #BEF264; font-weight: 800; vertical-align: middle; border-color: rgba(255,255,255,.15); }
  table.grid td.r small.rt { display: block; margin-top: 2px; color: #BFE3D3; font-size: 10.5px; font-weight: 600; }
  table.grid td.e { background: #FAFAF9; color: var(--faint); vertical-align: middle; }
  .gt { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .ty { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: var(--fill); color: var(--sub); }
  .ty.혼복 { background: #ECFCCB; color: #3F6212; } .ty.남복 { background: #F0F9FF; color: #075985; }
  .ty.여복 { background: #FFF1F2; color: #BE123C; } .ty.잡복 { background: #FEF3C7; color: #92400E; }
  .gs { font-size: 14px; font-weight: 900; color: #fff; padding: 1px 7px; border-radius: 6px; } .gs.wait { font-size: 10px; color: var(--faint); font-weight: 600; padding: 0; }
  /* 끝난 경기 — 이긴 팀 색으로 옅게 칠하고 왼쪽 띠·점수 상자(앱 대진표와 같은 규칙) */
  table.grid td.done { border-left-width: 5px; }
  .gn { font-size: 12px; line-height: 1.45; margin-top: 2px; } .gn.win { color: var(--green); font-weight: 800; }
  .gv { font-size: 9px; color: var(--faint); margin: 2px 0; }
  .tp.sm { font-size: 10px; padding: 0 5px; }
  /* 본선 사다리 — 앱의 BracketTree 와 같은 모양(위·아래에서 가운데 결승으로) */
  .lad-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .lad { position: relative; }
  .lad .ln { position: absolute; background: var(--line); }
  .lad .ln.on { background: var(--green2); border-radius: 2px; }
  .lad .bx { position: absolute; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .lad .bx.fin { border: 2px solid var(--green); }
  .lad .tr { height: 26px; display: flex; align-items: center; padding: 0 7px; font-size: 12px; position: relative; }
  .lad .tr + .tr { border-top: 1px solid var(--line); }
  .lad .tr .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 500; }
  .lad .tr .s { font-weight: 800; color: var(--faint); margin-left: 4px; }
  .lad .tr.win { background: var(--green-soft); }
  .lad .tr.win::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--green); }
  .lad .tr.win .nm, .lad .tr.win .s { color: var(--green); font-weight: 800; }
  .lad .tr.lose { background: var(--fill); }
  .lad .tr.lose .nm { color: var(--faint); }
  .lad .tr .nm.empty { color: var(--faint); }
  .lad .rl { position: absolute; left: 2px; font-size: 11.5px; font-weight: 800; color: var(--faint); white-space: nowrap; }
  .lad .rl.fin { color: var(--green); }
  .champ { background: var(--ink); color: #fff; text-align: center; padding: 18px; border-radius: 16px; margin-top: 12px; }
  .champ small { color: #A3E635; font-weight: 800; letter-spacing: .1em; }
  .champ b { display: block; font-size: 21px; margin-top: 6px; }
  .err { background: #FEF2F2; color: var(--no); border-radius: 14px; padding: 16px; margin-top: 16px; line-height: 1.6; }
  /* 내 경기 찾기 — 이름을 넣으면 그 사람 경기만 모아 보이고 대진표에서도 칠한다(앱의 '내 경기'와 같은 효과) */
  .find h2 { margin-bottom: 6px; }
  .find input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .find input:focus { outline: none; border-color: var(--green2); background: #fff; }
  .find .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .find .pick button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .mg { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--fill); font-size: 13px; }
  .mg:first-of-type { border-top: 0; }
  .mg .wh { min-width: 86px; font-weight: 800; color: var(--ink); }
  .mg .wh span { display: block; font-size: 11.5px; color: var(--sub); font-weight: 600; }
  .mg .vs { flex: 1; line-height: 1.5; color: var(--sub); }
  .mg .vs b { color: var(--ink); }
  .mg .rs { font-weight: 900; white-space: nowrap; }
  .mg.next { background: var(--green-soft); border-radius: 10px; padding: 8px; margin: 2px -8px; border-top: 0; }
  .mg.next .wh::before { content: '다음 경기'; display: block; font-size: 10.5px; color: var(--green); font-weight: 900; }
  table.grid td.mine { outline: 3px solid var(--green2); outline-offset: -3px; }
  .gn .me { background: #FDE68A; color: var(--ink); font-weight: 900; border-radius: 3px; padding: 0 2px; }
  .foot { font-size: 12px; color: var(--faint); text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="meta">불러오는 중…</p></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var c = q.get('c') || '', t = q.get('t') || '';
  var app = document.getElementById('app');
  var tab = null, data = null;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (x) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]; }); };

  function standings(g, advance) {
    var kdk = g.kind === 'kdk';
    if (kdk) advance = 0;          // KDK 는 개인 순위로 끝(본선 없음)
    var rows = g.standings.map(function (r) {
      var up = advance > 0 && r.rank <= advance && r.played > 0;
      var d = r.diff > 0 ? '<span class="plus">+' + r.diff + '</span>' : r.diff < 0 ? '<span class="minus">' + r.diff + '</span>' : '0';
      return '<tr><td><span class="rk' + (up ? ' up' : '') + '">' + r.rank + (r.tie ? '=' : '') + '</span></td>' +
        '<td class="l">' + esc(r.name) + '</td><td>' + r.played + '</td><td class="w">' + r.w + '</td><td>' + r.l + '</td>' +
        '<td>' + r.gf + '</td><td>' + r.ga + '</td><td>' + d + '</td></tr>';
    }).join('');
    return '<table><tr><th>순위</th><th class="l">' + (kdk ? '이름' : '팀') + '</th><th>경기</th><th>승</th><th>패</th><th>득</th><th>실</th><th>득실</th></tr>' + rows + '</table>' +
      '<p class="note">경기 ' + g.progress.done + '/' + g.progress.total + (advance > 0 ? ' · 초록 순위 = 본선 진출권(상위 ' + advance + '팀)' : '') + '</p>';
  }
  function matches(list) {
    return list.map(function (m) {
      var aw = m.score && m.score.a > m.score.b, bw = m.score && m.score.b > m.score.a;
      return '<div class="m"><div class="when">' + (m.round ? m.round + '타임' : '') + '<span>' + (m.court ? '코트 ' + m.court : '') + '</span></div>' +
        '<div class="teams"><div class="' + (aw ? 'win' : '') + '">' + esc(m.a || '—') + '</div><div class="' + (bw ? 'win' : '') + '">' + esc(m.b || '—') + '</div></div>' +
        (m.score ? '<div class="sc">' + m.score.a + ' : ' + m.score.b + '</div>' : '<div class="sc wait">경기 전</div>') + '</div>';
    }).join('');
  }
  /* 본선 사다리 — r 라운드 i 경기의 승자 → r+1 라운드 floor(i/2) 경기.
     위쪽 절반은 위에서 아래로, 아래쪽 절반은 아래에서 위로 올라와 가운데 결승에서 만난다.
     이긴 팀이 올라간 길은 굵은 초록 선, 진 팀 칸은 흐리게. */
  function ladder(ko, avail) {
    var R = ko.rounds || [], RN = R.length;
    if (!RN) return '';
    var ROW = 26, H = ROW * 2 + 3, VG = 36, TOP = 20, MIN = 84, THIN = 1.5, THICK = 3.5;
    var n0 = R[0].matches.length, two = RN >= 2;
    var perRow = two ? Math.max(1, n0 / 2) : 1;
    var slot = Math.max(MIN, Math.floor(avail / perRow));
    var bw = Math.min(slot - 8, 180);
    var W = Math.max(avail, perRow * slot);
    var rows = two ? 2 * (RN - 1) + 1 : 1;
    var rowY = function (row) { return TOP + row * (H + VG); };
    var HT = rowY(rows - 1) + H + 4;
    var pos = function (r, i) {
      if (r === RN - 1) return { side: 'final', row: two ? RN - 1 : 0, cx: W / 2 };
      var n = R[r].matches.length, top = i < n / 2, j = top ? i : i - n / 2, span = W / (n / 2);
      return { side: top ? 'top' : 'bottom', row: top ? r : 2 * (RN - 1) - r, cx: (j + 0.5) * span };
    };
    var thin = [], thick = [], boxes = [], labels = [];
    var line = function (x, y, w, h, on) {
      var t = on ? THICK : THIN;
      var st = 'left:' + (x - (w ? 0 : t / 2)) + 'px;top:' + (y - (h ? 0 : t / 2)) + 'px;width:' + (w ? w + (on ? t / 2 : 0) : t) + 'px;height:' + (h ? h + (on ? t / 2 : 0) : t) + 'px';
      (on ? thick : thin).push('<div class="ln' + (on ? ' on' : '') + '" style="' + st + '"></div>');
    };
    var team = function (m, side, first) {
      var nm = m[side], other = m[side === 'a' ? 'b' : 'a'];
      var bye = first && !nm && other;
      var st = !m.winner ? '' : m.winner === side ? 'win' : 'lose';
      var sc = m.score ? m.score[side] : null;
      return '<div class="tr ' + st + '"><span class="nm' + (nm ? '' : ' empty') + '">' + esc(nm || (bye ? '부전승' : '—')) + '</span>' +
        (sc != null ? '<span class="s">' + sc + '</span>' : '') + '</div>';
    };
    R.forEach(function (round, r) {
      round.matches.forEach(function (m, i) {
        var p = pos(r, i), y = rowY(p.row);
        boxes.push('<div class="bx' + (p.side === 'final' ? ' fin' : '') + '" style="left:' + (p.cx - bw / 2) + 'px;top:' + y + 'px;width:' + bw + 'px;height:' + H + 'px">' +
          team(m, 'a', r === 0) + team(m, 'b', r === 0) + '</div>');
        if (r === RN - 1) return;
        var pp = pos(r + 1, Math.floor(i / 2)), py = rowY(pp.row), on = !!m.winner;
        if (p.side === 'top') {
          var y0 = y + H, ym = y0 + VG / 2;
          line(p.cx, y0, 0, VG / 2, on); line(Math.min(p.cx, pp.cx), ym, Math.abs(pp.cx - p.cx), 0, on); line(pp.cx, ym, 0, py - ym, on);
        } else {
          var ym2 = y - VG / 2;
          line(p.cx, ym2, 0, VG / 2, on); line(Math.min(p.cx, pp.cx), ym2, Math.abs(pp.cx - p.cx), 0, on); line(pp.cx, py + H, 0, ym2 - (py + H), on);
        }
      });
      var fin = r === RN - 1;
      var rs = fin ? [two ? RN - 1 : 0] : [r, 2 * (RN - 1) - r];
      rs.forEach(function (row) {
        labels.push('<div class="rl' + (fin ? ' fin' : '') + '" style="top:' + (rowY(row) - 17) + 'px">' + esc(round.name) + (fin && ko.champion ? ' · 🏆 ' + esc(ko.champion) : '') + '</div>');
      });
    });
    return '<div class="lad-scroll"><div class="lad" style="width:' + W + 'px;height:' + HT + 'px">' +
      thin.join('') + thick.join('') + boxes.join('') + labels.join('') + '</div></div>';
  }
  function koAvail() { return Math.max(260, app.clientWidth - 32 - 30); }   // .wrap 좌우 16 + 카드 안쪽 15

  /* 청백전(2팀·3팀)·팀 리그 — 서버 shared/teamLive.js 의 모양(kind 'teams') */
  function teamPill(tm) {
    if (!tm) return '';
    return '<span class="tp' + (tm.white ? ' white' : '') + '" style="background:' + esc(tm.color) + '">' + esc(tm.name) + '</span>';
  }
  function renderTeams(d) {
    var byIdx = {};
    d.teams.forEach(function (x) { byIdx[x.idx] = x; });
    mountTeams();
    var top = '<div class="club">' + esc(d.club) + '</div><h1>' + esc(d.name) + '</h1>' +
      '<div class="meta">' + esc(d.date) + (d.rounds[0] && d.rounds[0].time ? ' ' + esc(d.rounds[0].time) : '') + ' · ' + d.done + '/' + d.total + '경기 끝남</div>' +
      '<div class="live"><span class="dot"></span>' + (d.status === 'finished' ? '대회 종료' : '실시간 — 30초마다 새로 고침') + '</div>';
    var h = '';
    var me = findMe(d);
    var st = d.standings;
    if (st.length === 2) {
      /* 2팀 — 큰 점수판(이긴 경기 수) */
      var A = st.filter(function (r) { return r.idx === 0; })[0] || st[0];
      var B = st.filter(function (r) { return r.idx === 1; })[0] || st[1];
      h += '<div class="board">' +
        '<div class="side' + (A.wins > B.wins ? ' lead' : '') + '">' + teamPill(A) + '<b>' + A.wins + '</b></div>' +
        '<div class="colon">:</div>' +
        '<div class="side' + (B.wins > A.wins ? ' lead' : '') + '">' + teamPill(B) + '<b>' + B.wins + '</b></div></div>' +
        '<div class="sum" style="text-align:center">총 게임 ' + A.gf + ' : ' + B.gf + (A.draws ? ' · 무승부 ' + A.draws : '') + '</div>';
    }
    h += '<div class="card"><h2>팀 순위</h2><table><tr><th>순위</th><th class="l">팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득실</th></tr>' +
      st.map(function (r) {
        return '<tr><td><span class="rk' + (r.rank === 1 && r.played ? ' up' : '') + '">' + r.rank + '</span></td>' +
          '<td class="l">' + teamPill(r) + ' <small style="color:var(--faint)">' + r.players + '명</small></td>' +
          '<td>' + r.played + '</td><td class="w">' + r.wins + '</td><td>' + r.draws + '</td><td>' + r.losses + '</td>' +
          '<td class="' + (r.diff > 0 ? 'plus' : r.diff < 0 ? 'minus' : '') + '">' + (r.diff > 0 ? '+' : '') + r.diff + '</td></tr>';
      }).join('') + '</table><p class="note">순위: 이긴 경기 → 게임 득실 → 딴 게임</p></div>';
    var order = ['남복', '여복', '혼복', '잡복', '남단식', '여단식', '혼성단식'];
    var typeLine = order.filter(function (k) { return d.types[k]; }).map(function (k) { return k + ' ' + d.types[k]; }).join(' · ');
    h += '<div class="card"><h2>대진 · 결과</h2>' + (typeLine ? '<div class="sum">총 ' + d.total + '경기 · ' + esc(typeLine) + '</div>' : '');
    /* 대진표 — 가로 = 코트, 세로 = 타임(앱과 같은 모양, 2026-10-04 앱 주인).
       열 순서는 코트 번호(c)로. 서버가 아직 번호를 안 주는 판이면 처음 나온 순서로 */
    var cols = [];
    d.rounds.forEach(function (r) {
      r.matches.forEach(function (m) {
        var key = m.c ? 'n' + m.c : 'l' + m.court;
        if (!cols.some(function (x) { return x.key === key; })) cols.push({ key: key, label: m.court, n: m.c || 0 });
      });
    });
    if (cols.every(function (x) { return x.n; })) cols.sort(function (a, b) { return a.n - b.n; });
    /* 끝난 경기의 색 — 이긴 팀 색(백팀은 검정), 무승부 회색. 칸은 그 색을 옅게(끝 두 자리 = 투명도) */
    var accentOf = function (m) {
      if (!m.score) return '';
      if (m.score.a === m.score.b) return '#d97706';   // 무승부는 노랑 — 회색이면 백팀 승과 헷갈린다
      var w = byIdx[m.score.a > m.score.b ? m.aTeam : m.bTeam];
      return !w ? '#0E6B4F' : w.white ? '#111827' : w.color;
    };
    var cell = function (m) {
      var aw = m.score && m.score.a > m.score.b;
      var bw = m.score && m.score.b > m.score.a;
      var ac = accentOf(m);
      /* 백팀 승 — 백팀 이름표와 같은 모양(흰 상자 + 검은 테두리·글씨) */
      var whiteWin = !!m.score && m.score.a !== m.score.b && !!(byIdx[m.score.a > m.score.b ? m.aTeam : m.bTeam] || {}).white;
      var draw = !!m.score && m.score.a === m.score.b;
      var pill = function (tm) { return tm ? '<span class="tp sm' + (tm.white ? ' white' : '') + '" style="background:' + esc(tm.color) + '">' + esc(tm.name) + '</span>' : ''; };
      return '<div class="gt"><span class="ty ' + esc(m.type) + '">' + esc(m.type) + '</span>' +
        (m.score ? '<span class="gs" style="' + (whiteWin ? 'background:#fff;color:#111827;border:1.5px solid #111827' : 'background:' + esc(ac)) + '">'
          + m.score.a + ':' + m.score.b + (draw ? ' 무' : '') + '</span>' : '<span class="gs wait">경기 전</span>') + '</div>' +
        pill(byIdx[m.aTeam]) + '<div class="gn"' + nameStyle(m, aw) + '>' + names(m.a) + '</div>' +
        '<div class="gv">vs</div>' +
        pill(byIdx[m.bTeam]) + '<div class="gn"' + nameStyle(m, bw) + '>' + names(m.b) + '</div>';
    };
    /* 찾은 이름은 노란 바탕으로 */
    var names = function (joined) {
      if (!joined) return '—';
      return splitNames(joined).map(function (n) { return n === me ? '<span class="me">' + esc(n) + '</span>' : esc(n); }).join('·');
    };
    /* 이긴 쪽 이름은 그 팀 색으로 굵게, 진 쪽은 흐리게 */
    var nameStyle = function (m, won) {
      if (!m.score) return '';
      return won ? ' style="color:' + esc(accentOf(m)) + ';font-weight:800"' : ' style="color:var(--faint)"';
    };
    if (d.rounds.length) {
      h += '<div class="gscroll"><table class="grid"><tr><th></th>' + cols.map(function (c, i) {
        return '<th class="' + (i === 0 ? 'c1 ' : '') + (i === cols.length - 1 ? 'cl' : '') + '">코트 ' + esc(c.label) + '</th>';
      }).join('') + '</tr>';
      d.rounds.forEach(function (r) {
        /* 대회 시간을 정했으면 타임 아래 시작 시각(r.time) */
        h += '<tr><td class="r">' + r.round + 'T' + (r.time ? '<small class="rt">' + esc(r.time) + '</small>' : '') + '</td>' + cols.map(function (c) {
          var m = r.matches.filter(function (x) { return (x.c ? 'n' + x.c : 'l' + x.court) === c.key; })[0];
          var ac = m ? accentOf(m) : '';
          var wt = m && m.score && m.score.a !== m.score.b && (byIdx[m.score.a > m.score.b ? m.aTeam : m.bTeam] || {}).white;
          var mineCls = m && me && isMine(m, me) ? ' mine' : '';
          return m ? (ac ? '<td class="done' + mineCls + '" style="background:' + esc(ac) + (wt ? '14' : '1F') + ';border-left-color:' + esc(ac) + '">' : '<td class="' + mineCls + '">') + cell(m) + '</td>' : '<td class="e">—</td>';
        }).join('') + '</tr>';
      });
      h += '</table></div><p class="note">표가 넓으면 옆으로 밀어 보세요 · 색칠된 칸 = 끝난 경기(이긴 팀 색) · 흰 칸 = 경기 전</p>';
    } else {
      h += '<p class="note">아직 대진이 없습니다.</p>';
    }
    h += '</div><p class="foot">Court · 테니스 클럽 운영 앱</p>';
    document.getElementById('top').innerHTML = top;
    document.getElementById('rest').innerHTML = h;
    renderMine(d, byIdx, me);
  }

  /* ============================================================
     내 경기 찾기 — 앱이 없는 참가자가 이름을 넣으면 자기 경기를 모아 본다
     (2026-10-04 앱 주인: "웹으로 공유받는 사람은 본인 경기가 언제인지 표시가 안 되어 있으니
      이름 검색하면 앱으로 자기 경기 보는 것과 같은 효과"). 이 휴대폰에만 기억한다(다음에 열면 그대로).
     ⚠️ 입력칸은 한 번만 만든다 — 30초마다 다시 그려도 쓰던 글자·키보드가 날아가지 않게.
     ============================================================ */
  var meQ = '';
  try { meQ = localStorage.getItem('court-live-me') || ''; } catch (e) { meQ = ''; }
  function splitNames(joined) { return String(joined || '').split('·').map(function (x) { return x.trim(); }).filter(Boolean); }
  function isMine(m, name) { return splitNames(m.a).indexOf(name) >= 0 || splitNames(m.b).indexOf(name) >= 0; }
  function allNames(d) {
    var seen = {}, out = [];
    d.rounds.forEach(function (r) { r.matches.forEach(function (m) { splitNames(m.a).concat(splitNames(m.b)).forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } }); }); });
    return out;
  }
  /* 넣은 글자로 한 사람을 고른다 — 이름과 똑같거나, 그 글자가 든 이름이 하나뿐일 때 */
  function candidates(d) {
    var q = meQ.replace(/\s+/g, '');
    if (!q) return [];
    return allNames(d).filter(function (n) { return n.replace(/\s+/g, '').indexOf(q) >= 0; });
  }
  function findMe(d) {
    var q = meQ.replace(/\s+/g, '');
    var c = candidates(d);
    var exact = c.filter(function (n) { return n.replace(/\s+/g, '') === q; });
    return exact.length === 1 ? exact[0] : c.length === 1 ? c[0] : '';
  }
  function mountTeams() {
    if (document.getElementById('find')) return;
    app.innerHTML = '<div id="top"></div>' +
      '<div class="card find" id="find"><h2>내 경기 찾기</h2>' +
      '<input id="meq" type="search" enterkeyhint="search" autocomplete="off" placeholder="이름을 넣으세요 (예: 홍길동)">' +
      '<div id="mine"></div></div><div id="rest"></div>';
    var inp = document.getElementById('meq');
    inp.value = meQ;
    inp.oninput = function () {
      meQ = inp.value.trim();
      try { localStorage.setItem('court-live-me', meQ); } catch (e) { /* 못 남겨도 그대로 */ }
      if (data) renderTeams(data);
    };
  }
  function renderMine(d, byIdx, me) {
    var box = document.getElementById('mine');
    if (!meQ) { box.innerHTML = '<p class="note">이름을 넣으면 내 경기만 모아 보이고, 아래 대진표에서도 내 칸이 칠해집니다.</p>'; return; }
    if (!me) {
      var c = candidates(d);
      box.innerHTML = c.length
        ? '<p class="note">누구인가요? 눌러서 고르세요</p><div class="pick">' + c.slice(0, 20).map(function (n) { return '<button data-n="' + esc(n) + '">' + esc(n) + '</button>'; }).join('') + '</div>'
        : '<p class="note">이 대진에 "' + esc(meQ) + '" 이름이 없습니다. 운영진이 적은 이름 그대로 넣어 보세요.</p>';
      Array.prototype.forEach.call(box.querySelectorAll('.pick button'), function (b) {
        b.onclick = function () { var inp = document.getElementById('meq'); inp.value = b.getAttribute('data-n'); inp.oninput(); };
      });
      return;
    }
    var games = [];
    d.rounds.forEach(function (r) {
      r.matches.forEach(function (m) {
        if (!isMine(m, me)) return;
        var mineA = splitNames(m.a).indexOf(me) >= 0;
        games.push({ r: r, m: m, mineA: mineA });
      });
    });
    var nextIdx = -1;
    games.some(function (g, i) { if (!g.m.score) { nextIdx = i; return true; } return false; });
    var w = 0, l = 0;
    var rows = games.map(function (g, i) {
      var m = g.m;
      var partner = splitNames(g.mineA ? m.a : m.b).filter(function (n) { return n !== me; }).join('·');
      var opp = splitNames(g.mineA ? m.b : m.a).join('·');
      var oppTeam = byIdx[g.mineA ? m.bTeam : m.aTeam];
      var res = '<span class="rs" style="color:var(--faint)">대기</span>';
      if (m.score) {
        var my = g.mineA ? m.score.a : m.score.b, op = g.mineA ? m.score.b : m.score.a;
        if (my > op) w += 1; else if (my < op) l += 1;
        res = '<span class="rs" style="color:' + (my > op ? 'var(--green)' : my < op ? 'var(--no)' : 'var(--sub)') + '">' + my + ':' + op + ' ' + (my > op ? '승' : my < op ? '패' : '무') + '</span>';
      }
      return '<div class="mg' + (i === nextIdx ? ' next' : '') + '"><div class="wh">' + g.r.round + '타임' + (g.r.time ? ' ' + esc(g.r.time) : '') +
        '<span>코트 ' + esc(m.court) + ' · ' + esc(m.type) + '</span></div>' +
        '<div class="vs">' + (partner ? '짝 <b>' + esc(partner) + '</b><br>' : '') + '상대 ' + (oppTeam ? teamPill(oppTeam) + ' ' : '') + '<b>' + esc(opp || '—') + '</b></div>' + res + '</div>';
    }).join('');
    box.innerHTML = '<p class="sum" style="margin:2px 0 6px"><b style="color:var(--ink)">' + esc(me) + '</b> · ' + games.length + '경기' +
      (w + l ? ' · ' + w + '승 ' + l + '패' : '') + '</p>' + (rows || '<p class="note">아직 이 사람 경기가 없습니다.</p>');
  }

  function render() {
    var d = data;
    if (d.kind === 'teams') { renderTeams(d); return; }
    var tabs = [];
    if (d.bracket.length) tabs.push(['ko', '본선']);
    if (d.groups.length) tabs.push(['all', '전체 순위']);
    d.groups.forEach(function (g, i) { tabs.push(['g' + i, g.name]); });
    if (!tab || !tabs.some(function (x) { return x[0] === tab; })) tab = tabs.length ? tabs[0][0] : null;
    var h = '<div class="club">' + esc(d.club) + '</div><h1>' + esc(d.name) + '</h1>' +
      '<div class="meta">' + esc(d.date) + ' · ' + d.rules.games + '게임 선승 · 순위: ' + esc(d.rankRule) + '</div>' +
      '<div class="live"><span class="dot"></span>' + (d.status === 'finished' ? '대회 종료' : '실시간 — 30초마다 새로 고침') + '</div>';
    if (d.champion) h += '<div class="champ"><small>CHAMPION</small><b>🏆 ' + esc(d.champion) + '</b></div>';
    h += '<div class="tabs">' + tabs.map(function (x) { return '<button class="tab' + (tab === x[0] ? ' on' : '') + '" data-k="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
    if (tab === 'ko' && d.kos) {
      var av = koAvail();
      d.kos.forEach(function (k) {
        h += '<div class="card"><h2>' + esc(k.name ? k.name + ' 본선' : '본선 토너먼트') + '</h2>' + ladder(k, av) +
          '<p class="note">굵은 초록 선 = 이긴 팀이 올라간 길 · 흐린 칸 = 진 팀</p></div>';
      });
    } else if (tab === 'ko') {
      /* 서버 함수가 아직 예전 판(사다리 자료 없음)일 때 — 라운드별 목록 */
      d.bracket.forEach(function (r) { h += '<div class="card"><h2>' + esc(r.name) + '</h2>' + matches(r.matches) + '</div>'; });
    } else if (tab === 'all') {
      d.groups.forEach(function (g) { h += '<div class="card"><h2>' + esc(g.name) + '</h2>' + standings(g, g.advance != null ? g.advance : d.rules.advance) + '</div>'; });
    } else if (tab) {
      var g = d.groups[Number(tab.slice(1))];
      h += '<div class="card"><h2>' + esc(g.name) + ' 순위</h2>' + standings(g, g.advance != null ? g.advance : d.rules.advance) + '</div>';
      h += '<div class="card"><h2>' + esc(g.name) + ' 경기</h2>' + matches(g.matches) + '</div>';
    }
    h += '<p class="foot">Court · 테니스 클럽 운영 앱</p>';
    app.innerHTML = h;
    Array.prototype.forEach.call(app.querySelectorAll('.tab'), function (b) {
      b.onclick = function () { tab = b.getAttribute('data-k'); render(); };
    });
  }
  /* 30초마다 다시 읽되, 화면을 안 보고 있을 때(다른 앱·화면 꺼짐)는 쉰다 — 돌아오면 바로 한 번 읽는다.
     켜 둔 채 잊어도 서버를 계속 부르지 않게(2026-10-04 앱 주인: 비용). 대회가 끝나면 아예 멈춘다. */
  var waiting = false;
  function later() {
    if (document.hidden) { waiting = true; return; }
    setTimeout(load, 30000);
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && waiting) { waiting = false; load(); }
  });
  function load() {
    fetch('/api/live?c=' + encodeURIComponent(c) + '&t=' + encodeURIComponent(t), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { app.innerHTML = '<div class="err">' + esc(j.message || '대회를 열지 못했습니다.') + '</div>'; return; }
        data = j; render();
        if (j.status !== 'finished') later();
      })
      .catch(function () {
        if (!data) app.innerHTML = '<div class="err">연결이 불안정합니다. 잠시 후 다시 열어 주세요.</div>';
        later();
      });
  }
  /* 화면을 돌리거나 창 크기가 바뀌면 사다리 폭을 다시 맞춘다 */
  var rz = null, lastW = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (data && tab === 'ko' && Math.abs(app.clientWidth - lastW) > 2) { lastW = app.clientWidth; render(); } }, 150);
  });
  if (!c || !t) app.innerHTML = '<div class="err">링크 주소가 잘못되었습니다. 운영진에게 다시 받아 주세요.</div>';
  else load();
})();
</script>
</body>
</html>
