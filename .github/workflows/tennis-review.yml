# 테니스매치 — 스토어 심사용 계정 + 시험 클럽
#
# 구글 플레이·앱스토어 심사자가 로그인해서 기능을 볼 수 있도록 계정과
# 내용이 들어 있는 시험 클럽을 만든다. 플레이 콘솔 › 앱 콘텐츠 › 앱 액세스에
# 아래 시크릿과 같은 이메일·비밀번호를 적는다.
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions)
#   REVIEW_EMAIL      심사용 이메일 (실제로 받을 수 있는 주소가 아니어도 된다)
#   REVIEW_PASSWORD   8자 이상
#   FIREBASE_SERVICE_ACCOUNT  이미 있는 것
#
# ⚠️ 비밀번호는 로그에 찍지 않는다. 채팅에도 붙이지 않는다.
# ⚠️ 모임 날짜가 지나면 심사자가 빈 일정을 본다. 심사 제출 직전에 한 번 더 돌린다.
# ⚠️ 이 파일은 기본 브랜치와 작업 브랜치에 똑같이 둔다(버튼은 기본 브랜치 것을 쓴다).
name: 테니스매치 심사용 계정

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'setup = 만들기·날짜 새로 고치기 / remove = 계정과 시험 클럽 지우기'
        type: choice
        options: [setup, remove]
        default: setup
      ref:
        description: '스크립트를 가져올 브랜치'
        type: string
        default: 'claude/tennis-app-roadmap-review-oxol8b'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tennis-match
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 서버 라이브러리 설치
        run: npm ci --prefix functions

      - name: 인증 준비
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RE: ${{ secrets.REVIEW_EMAIL }}
          RP: ${{ secrets.REVIEW_PASSWORD }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 없습니다."; exit 1; fi
          if [ -z "$RE" ]; then echo "::error::REVIEW_EMAIL 시크릿이 없습니다."; exit 1; fi
          if [ -z "$RP" ] && [ "${{ inputs.action }}" = "setup" ]; then echo "::error::REVIEW_PASSWORD 시크릿이 없습니다."; exit 1; fi
          echo "REVIEW_EMAIL: 있음 · REVIEW_PASSWORD: $([ -n "$RP" ] && echo 있음 || echo 없음)"
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: 실행
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GOOGLE_CLOUD_PROJECT: tennis-match-52b31
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
          REVIEW_ACTION: ${{ inputs.action }}
        run: node scripts/review-account.mjs
