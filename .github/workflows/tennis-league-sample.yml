# 테니스매치 — 샘플 대회 넣기·지우기
#
# 다른 도구로 짠 단체전 대진(쿤블던 등)을 클럽의 **새 대회 하나**로 넣어 앱에서 시험해 본다.
# 건드리는 것은 그 샘플 대회 문서 하나뿐이다 — 기존 대회·회원·클럽 설정은 읽기만 한다.
# 지울 때도 sample 표시가 붙은 그 문서만 지운다. 자세한 것은 tennis-match/scripts/league-sample.cjs 머리말.
#
# ⚠️ 저장소가 공개라 명단은 암호화한 파일로만 둔다. 열쇠는 아래 [열쇠] 칸에 넣고, 로그에서 가린다.
# ⚠️ 이 파일은 기본 브랜치와 작업 브랜치에 똑같이 둔다(버튼은 기본 브랜치 것을 쓴다).
name: 테니스매치 샘플 대회

on:
  workflow_dispatch:
    inputs:
      action:
        description: '무엇을 할까 (dry = 확인만, create = 넣기·다시 넣기, remove = 지우기)'
        type: choice
        options: [dry, create, remove]
        default: dry
      passphrase:
        description: '열쇠 (create·dry 에 필요, remove 는 비워도 됨)'
        type: string
        default: ''
      club:
        description: '클럽 이름'
        type: string
        default: '써티포티'
      title:
        description: '대회 이름'
        type: string
        default: '[샘플] 쿤블던'
      file:
        description: '데이터 파일 (tennis-match 기준)'
        type: string
        default: 'data/kunnbledun.enc.json'
      ref:
        description: '스크립트를 가져올 브랜치'
        type: string
        default: 'claude/tennis-app-roadmap-review-oxol8b'

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tennis-match
    steps:
      - name: 열쇠 가리기
        working-directory: .
        env:
          PASS: ${{ inputs.passphrase }}
        run: |
          if [ -n "$PASS" ]; then echo "::add-mask::$PASS"; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 서버 라이브러리 설치
        run: npm ci --prefix functions

      - name: 인증 준비
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 비어 있습니다."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: 실행
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GOOGLE_CLOUD_PROJECT: tennis-match-52b31
          SAMPLE_ACTION: ${{ inputs.action }}
          SAMPLE_PASS: ${{ inputs.passphrase }}
          SAMPLE_CLUB: ${{ inputs.club }}
          SAMPLE_TITLE: ${{ inputs.title }}
          SAMPLE_FILE: ${{ inputs.file }}
        run: node scripts/league-sample.cjs

      - name: 인증 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
