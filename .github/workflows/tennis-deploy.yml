# 테니스매치 — 배포
#
# 두 가지로 돈다
#   자동   작업 브랜치에 푸시하면 바로 돈다. 버튼을 누를 사람이 없어도
#          앱 화면(OTA)과 보안 규칙·색인이 따라 올라간다. 태블릿만 있는
#          환경에서 "고쳤는데 반영을 못 하는" 상태를 없애려는 것이다.
#   버튼   [Run workflow] 로 손으로. 무엇을 올릴지 하나씩 고를 수 있고,
#          production 채널로 내보내는 것은 이쪽으로만 할 수 있다.
#
# ⚠️ 자동으로 도는 것이 위험하지 않은 이유
#   1. 배포 앞에 검증이 있다. 로직 테스트와 보안 규칙 테스트가 먼저 돌고,
#      하나라도 깨지면 그 자리에서 멈춘다 — 배포 단계까지 가지 않는다.
#   2. 자동일 때 OTA 는 preview 채널로만 나간다. preview 는 내부 테스트
#      앱이다. 스토어에 올라간 앱(production)은 손으로 눌러야만 바뀐다.
#   3. 자동일 때 서버 함수는 올리지 않는다. 함수는 되돌리기가 비싸고
#      권한도 따로 필요해서, 사람이 보고 있을 때만 올린다.
#
#   그래도 내보내고 싶지 않은 커밋이 있으면 커밋 메시지에 [배포안함] 을
#   넣는다. 그 푸시는 통째로 건너뛴다.
#
# ⚠️ 색인(indexes)을 빼먹지 말 것
#   채팅이 채널별 서버 필터를 쓴다. 색인 없이 규칙만 올리면 대화가
#   조용히 안 보인다 — 오류도 안 뜬다.
name: 테니스매치 배포

on:
  # 자동. 이 브랜치가 테니스 앱의 작업 브랜치다.
  # ⚠️ push 로 도는 workflow 는 "푸시된 브랜치의" 정의로 돈다. 기본
  #    브랜치의 사본은 버튼 화면을 그릴 때만 쓰인다. 그래도 둘을 같이
  #    맞춰 둔다 — 갈라지면 버튼과 자동이 서로 다르게 동작한다.
  push:
    branches: [claude/tennis-app-roadmap-review-oxol8b]
    paths:
      - 'tennis-match/**'
      - '.github/workflows/tennis-deploy.yml'
  workflow_dispatch:
    inputs:
      # ⚠️ 위의 [Use workflow from] 이 아니라 **이 값**이 배포된다.
      #    저 드롭다운은 "workflow 정의를 어느 브랜치에서 읽을까"를 정할 뿐인데,
      #    기본값이 이 저장소의 기본 브랜치(가계부)라서 그대로 두기 쉽다.
      #    실제로 그렇게 눌렀다가 tennis-match 폴더가 없어 시작하자마자 죽었다.
      #    그래서 배포할 코드는 저 드롭다운과 떼어 놓고 여기서 받는다.
      ref:
        description: '배포할 브랜치 (위 Use workflow from 과 무관하게 이 값이 배포됩니다)'
        type: string
        default: 'claude/tennis-app-roadmap-review-oxol8b'
      rules:
        description: 'Firestore 보안 규칙'
        type: boolean
        default: true
      indexes:
        description: 'Firestore 색인 (채팅에 필요)'
        type: boolean
        default: true
      functions:
        description: 'Cloud Functions (푸시 알림·회비 독촉)'
        type: boolean
        default: true
      ota:
        description: 'OTA 업데이트 (eas update — 앱 화면 반영)'
        type: boolean
        default: true
      channel:
        description: 'OTA 채널'
        type: choice
        options: [preview, production]
        default: preview

# 도구 버전을 고정한다.
#   npx firebase-tools 는 부를 때마다 최신을 받는다. 그래서 어느 날 갑자기
#   요구사항이 바뀌어도 우리는 모른다 — 실제로 그렇게 당했다(Java 21 요구).
#   올릴 때는 사람이 이 줄을 고쳐서, 그 커밋으로 한 번 돌려 보고 올린다.
env:
  FIREBASE_TOOLS: '15.27.0'

  # ⚠️ push 로 들어오면 inputs 가 통째로 비어 있다. 아래 단계들이 전부
  #    inputs.rules 같은 값을 보고 있으므로, 그대로 두면 자동 배포가
  #    "아무것도 안 올리고 성공"으로 끝난다 — 제일 나쁜 실패다. 오류도
  #    안 뜨고, 초록 체크를 보고 반영된 줄 알게 된다.
  #
  #    그래서 "무엇을 올릴 것인가"를 여기 한 곳에서 정하고, 단계들은
  #    이 값만 본다. 읽는 법:
  #      버튼이면  사용자가 고른 값
  #      푸시면    규칙·색인·OTA 는 올리고, 함수는 올리지 않는다
  DO_RULES:     ${{ github.event_name != 'workflow_dispatch' || inputs.rules }}
  DO_INDEXES:   ${{ github.event_name != 'workflow_dispatch' || inputs.indexes }}
  DO_OTA:       ${{ github.event_name != 'workflow_dispatch' || inputs.ota }}
  DO_FUNCTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.functions || false }}
  # 자동일 때 production 으로 나가는 길은 없다. 스토어 앱을 사람 없이
  # 바꾸는 일은 없어야 한다.
  CHANNEL:      ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'preview' }}
  DEPLOY_REF:   ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

defaults:
  run:
    working-directory: tennis-match

concurrency:
  # 같은 것을 두 번 겹쳐 배포하지 않는다
  group: tennis-deploy
  cancel-in-progress: false

jobs:
  # 이 커밋을 내보낼 것인가만 정한다.
  #
  # 아직 내보낼 때가 아닌 커밋을 위한 비상구다. 커밋 "제목"에 [배포안함]
  # 을 넣으면 그 푸시는 통째로 건너뛴다. 버튼으로 부른 것은 사람이
  # 의도한 것이므로 이 검사를 받지 않는다.
  #
  # ⚠️ 제목(첫 줄)만 본다. 메시지 전체를 보면 이 표시를 *설명하는* 문장
  #    때문에 배포가 건너뛰어진다. 이 기능을 넣은 커밋 본문에 사용법을
  #    적었다가 실제로 그렇게 됐다 — 게다가 건너뛴 run 은 빨강이 아니라
  #    회색이라, 배포가 안 된 것을 한참 모른다.
  #
  # ⚠️ 커밋 메시지를 ${{ }} 로 스크립트 안에 직접 박지 않는다. 메시지에
  #    따옴표나 $(...) 가 들어 있으면 그대로 실행된다. env 로 넘겨서 받는다.
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        # 이 job 은 checkout 을 안 하므로 tennis-match 폴더가 없다.
        # 위 defaults 를 그대로 두면 폴더가 없어 이 검사 자체가 죽는다.
        working-directory: .
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          SUBJECT="$(printf '%s' "$MSG" | head -1)"
          if [ "$EVENT" = "push" ] && printf '%s' "$SUBJECT" | grep -qF '[배포안함]'; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 배포를 건너뛰었습니다"
              echo ""
              echo "커밋 제목에 \`[배포안함]\` 이 있습니다."
              echo ""
              echo "> $SUBJECT"
              echo ""
              echo "내보내려면 이 표시 없이 다시 푸시하거나, Actions 에서 손으로 실행하세요."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      # 브랜치를 잘못 골랐을 때 "No such file or directory" 대신
      # 무엇이 잘못됐는지 읽을 수 있게 알려 준다.
      # working-directory 를 . 로 되돌리는 이유: 아래 defaults 가 tennis-match 인데,
      # 그 폴더가 없는 것이 지금 확인하려는 바로 그 상황이다. 그대로 두면
      # 이 검사 자체가 같은 에러로 죽어서 아무것도 못 알려 준다.
      - name: 테니스 앱이 이 브랜치에 있는지 확인
        working-directory: .
        run: |
          if [ ! -f tennis-match/package.json ]; then
            echo "::error::'$DEPLOY_REF' 에는 테니스 앱(tennis-match 폴더)이 없습니다. [배포할 브랜치] 칸에 claude/tennis-app-roadmap-review-oxol8b 를 넣고 다시 실행하세요."
            exit 1
          fi
          echo "배포 대상: $DEPLOY_REF (${{ github.event_name == 'push' && '푸시 자동' || '버튼' }})"
          echo "올릴 것 — 규칙:$DO_RULES 색인:$DO_INDEXES 함수:$DO_FUNCTIONS OTA:$DO_OTA($CHANNEL)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tennis-match/package-lock.json

      # ⚠️ 21 이상이어야 한다. firebase-tools 15 부터 Java 21 미만을 거부한다.
      #    17 로 적었다가 "no longer supports Java version before 21" 로 막혔다.
      #    이 컨테이너는 21 이라 로컬에서는 통과해서, GitHub 에서야 드러났다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # ---------- 배포 전 검증 ----------
      - name: 로직 검증
        id: check_logic
        run: npm run test:all

      - name: 보안 규칙 검증
        id: check_rules
        run: npx --yes firebase-tools@$FIREBASE_TOOLS emulators:exec --only firestore "node scripts/test-rules.mjs"

      # ---------- Firebase ----------
      # 서비스 계정 키를 파일로 떨군다.
      # ⚠️ printf 로 쓴다. echo '${{ secrets.X }}' 로 쓰면 JSON 안의
      #    따옴표가 셸에서 해석되어 깨지거나, 최악의 경우 명령이 섞인다.
      - name: Firebase 인증 준비
        if: env.DO_RULES == 'true' || env.DO_INDEXES == 'true' || env.DO_FUNCTIONS == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 비어 있습니다."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/sa.json','utf8'))" \
            || { echo "::error::서비스 계정 JSON 형식이 아닙니다. 파일 내용을 그대로 붙여넣었는지 확인하세요."; exit 1; }

      # 서버 함수는 CLI 가 소스를 훑어 어떤 함수가 있는지 알아내는데,
      # 그때 functions/node_modules 가 있어야 한다. 없으면
      # "Failed to load function definition" 으로 배포가 막힌다.
      - name: 서버 함수 의존성 설치
        if: env.DO_FUNCTIONS == 'true'
        run: npm ci --prefix functions

      # ⚠️ `[ 조건 ] && 명령` 꼴로 쓰면 안 된다. GitHub 는 bash -e 로 돌리는데,
      #    마지막 줄의 조건이 거짓이면 그 줄이 실패로 끝나 단계 전체가 죽는다.
      #    "함수는 배포 안 함"을 골랐다는 이유로 배포가 실패한다.
      # ---------- Firebase 배포 ----------
      # ⚠️ 셋을 한 번에 올리지 않는다.
      #    처음에는 --only "rules,indexes,functions" 로 묶어서 올렸다.
      #    그랬더니 함수 권한(iam.serviceAccounts.ActAs) 하나가 없다는 이유로
      #    전체가 중단되어, 규칙도 색인도 못 올라갔다. 권한이 필요한 범위가
      #    셋이 서로 다르므로(규칙·색인은 Firestore, 함수는 IAM·Cloud Build)
      #    따로 올리고 결과를 모아서 판정한다.
      #
      #    continue-on-error 는 "실패를 눈감아 준다"가 아니다. 뒤의 단계까지
      #    가 보고 무엇이 되고 무엇이 안 됐는지 다 알려 준 다음, 마지막
      #    [배포 결과 판정]에서 실패로 끝낸다.
      - name: Firestore 보안 규칙
        id: dep_rules
        if: env.DO_RULES == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx --yes firebase-tools@$FIREBASE_TOOLS deploy \
            --only firestore:rules --project tennis-match-52b31 --non-interactive

      - name: Firestore 색인
        id: dep_indexes
        if: env.DO_INDEXES == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx --yes firebase-tools@$FIREBASE_TOOLS deploy \
            --only firestore:indexes --project tennis-match-52b31 --non-interactive

      - name: Cloud Functions
        id: dep_functions
        if: env.DO_FUNCTIONS == 'true'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # --force 를 쓰는 이유: 소스에서 사라진 함수를 지울지 물어보는데,
          # 비대화형에서는 그 물음에 답할 수가 없어 배포가 멈춘다.
          # 대신 "함수 이름을 바꾸면 옛 함수가 지워진다"는 뜻이므로,
          # 함수를 지우거나 이름을 바꾼 커밋은 배포 후 로그를 확인할 것.
          npx --yes firebase-tools@$FIREBASE_TOOLS deploy \
            --only functions --project tennis-match-52b31 --non-interactive --force

      # 권한 때문에 막힌 것이면 무엇을 해야 하는지 한 자리에 모아 준다.
      #
      # ⚠️ 이 안내는 네 번 고쳐 썼다. 그때마다 "다 적었다"고 생각했는데
      #    다음 오류가 또 새로운 권한이었다.
      #      1차  iam.serviceAccounts.ActAs
      #      2차  serviceusage 403
      #      3차  Cloud Build API
      #      4차  cloudscheduler.jobs.update  ← 예약 함수 3개만 막혔다
      #
      #    4차에서 배운 것: 안내가 "대개 권한 문제입니다" 같은 뭉뚱그린
      #    말로 시작하면, 정작 로그에 답이 적혀 있어도 읽는 사람이 그
      #    한 줄을 못 찾는다. 실제로 12개는 올라가고 3개만 막힌 상황을
      #    "전부 권한 문제"로 읽어서 원인을 한참 돌아갔다.
      #
      #    그래서 지금은 로그에 실제로 찍히는 권한 이름을 그대로 표에
      #    싣고, 그 옆에 줄 역할 이름을 붙인다. 뭉뚱그리지 않는다.
      - name: 배포가 막혔을 때 안내
        if: >-
          steps.dep_rules.outcome == 'failure'
          || steps.dep_indexes.outcome == 'failure'
          || steps.dep_functions.outcome == 'failure'
        run: |
          {
            echo "### 배포가 막혔습니다"
            echo ""
            echo "#### 먼저 — 정말 전부 막혔는지 확인하세요"
            echo ""
            echo "서버 함수는 **일부만 실패할 수 있습니다.** 위 로그에서"
            echo "\`Functions deploy had errors with the following functions:\` 를 찾으면"
            echo "막힌 함수 이름만 적혀 있습니다. 거기 없는 함수는 **이미 올라갔습니다.**"
            echo "전부 다시 할 필요가 없습니다."
            echo ""
            echo "#### 로그에 찍힌 권한 이름으로 찾으세요"
            echo ""
            echo "\`lacks IAM permission \"...\"\` 또는 \`Permission denied\` 가 보이면"
            echo "그 따옴표 안의 이름을 아래에서 찾습니다."
            echo ""
            echo "| 로그에 찍히는 이름 | 줘야 하는 역할 |"
            echo "|---|---|"
            echo "| \`cloudscheduler.jobs.*\` | **Cloud Scheduler 관리자** |"
            echo "| \`cloudfunctions.functions.*\` | **Cloud Functions 관리자** |"
            echo "| \`cloudbuild.builds.*\` | **Cloud Build 편집자** |"
            echo "| \`iam.serviceAccounts.ActAs\` | **서비스 계정 사용자** |"
            echo "| \`serviceusage.services.*\` · \`Permission denied to get service\` | **Firebase 관리자** |"
            echo "| \`artifactregistry.*\` | **Artifact Registry 관리자** |"
            echo ""
            echo "> ⚠️ **예약 함수**(매일 정해진 시각에 도는 것 — 회비 독촉,"
            echo "> 참석 투표 요청, 날씨 갱신)는 Cloud Scheduler 작업을 함께"
            echo "> 만듭니다. 그래서 다른 함수는 다 올라가는데 이 셋만 막히는"
            echo "> 일이 생깁니다. 그때 필요한 것이 **Cloud Scheduler 관리자** 입니다."
            echo ""
            echo "#### 역할 주는 곳 (한 번만)"
            echo ""
            echo "https://console.cloud.google.com/iam-admin/iam?project=tennis-match-52b31"
            echo ""
            echo "\`firebase-adminsdk-...@tennis-match-52b31.iam.gserviceaccount.com\` 줄의"
            echo "연필(수정) → **다른 역할 추가** → 위 표의 역할 → 저장."
            echo ""
            echo "> 하나씩 찾기가 번거로우면 **편집자**(Editor) 하나로 위 대부분이"
            echo "> 덮입니다. 다만 권한이 넓으니, 키가 새면 피해도 그만큼 큽니다."
            echo ""
            echo "#### API 가 꺼져 있다는 말이 보이면"
            echo ""
            echo "https://console.cloud.google.com/apis/library/cloudbuild.googleapis.com?project=tennis-match-52b31"
            echo ""
            echo "파란 **사용 설정** 버튼. 이미 켜져 있으면 \"관리\"라고 뜹니다 — 넘어가세요."
            echo ""
            echo "#### 그 전에 지금 당장 하고 싶다면"
            echo ""
            echo "**Cloud Functions 체크만 끄고** 실행하면 규칙·색인·OTA 는 올라갑니다."
            echo "서버 함수는 푸시 알림과 회비 자동 독촉만 담당하므로,"
            echo "화면 기능은 그것 없이도 전부 동작합니다."
            echo ""
            echo "> ⚠️ 이 화면이 이상한 한국어로 보이면 브라우저 자동 번역이 켜져"
            echo "> 있는 것입니다(\"색인\"이 \"색깔\"로 바뀌는 식). 주소창 옆 번역"
            echo "> 아이콘에서 끄면 원문이 보입니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 인증 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

      # ---------- OTA (앱 화면 반영) ----------
      # eas-cli 는 EXPO_TOKEN 을 알아서 읽는다. 따로 로그인하지 않는다.
      # ⚠️ 규칙·색인이 실패했으면 앱 화면만 새로 내보내지 않는다.
      #    새 화면은 새 규칙을 전제로 만들어져 있다. 규칙이 옛 것인 채로
      #    화면만 바뀌면, [대회 찾기] 같은 새 화면이 읽기 거부를 당해
      #    "빈 화면"으로 보인다. 오류도 안 뜨니 원인을 찾기 어렵다.
      #
      #    함수 실패는 막지 않는다. 함수는 푸시 알림·회비 독촉이라
      #    화면 동작과 무관하다.
      - name: OTA 업데이트
        id: dep_ota
        if: >-
          env.DO_OTA == 'true'
          && steps.dep_rules.outcome != 'failure'
          && steps.dep_indexes.outcome != 'failure'
        env:
          EXPO_TOKEN_RAW: ${{ secrets.EXPO_TOKEN }}
          # ⚠️⚠️ 이 줄들이 없으면 OTA 가 소셜 로그인 버튼을 지워 버린다.
          #
          #    app.config.js 는 `eas update` 를 돌리는 **이 러너에서**
          #    평가된다. 그 결과가 extra 로 굳어 업데이트에 실려 나가고,
          #    앱은 Constants.expoConfig 로 그 값을 읽는다. 즉 OTA 는
          #    화면 코드만 바꾸는 게 아니라 **설정도 통째로 갈아친다**.
          #
          #    여기에 키를 안 넘기면 extra.social 이 전부 빈 문자열이 되고,
          #    src/lib/social.js 규칙("준비 안 된 제공자는 안 그린다")에
          #    따라 [구글로 시작하기] 버튼이 조용히 사라진다. 오류도 안
          #    뜬다 — 그냥 없던 일이 된다.
          #
          #    실제로 그렇게 됐다. 디자인만 고쳐 푸시했는데 자동 배포가
          #    OTA 를 내보냈고, 기기에서 구글 버튼이 없어졌다. 빌드
          #    워크플로에는 이 줄들이 있었는데 배포 워크플로에는 없었다.
          #
          #    ⚠️ 여기 값은 빌드에 넣은 값과 **같아야 한다**. GitHub 시크릿과
          #    expo.dev 환경변수가 서로 다르면, 빌드한 앱과 OTA 로 덮인 앱이
          #    서로 다른 클라이언트 ID 를 쓰게 된다.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_NATIVE_KEY: ${{ secrets.KAKAO_NATIVE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          APPLE_SERVICE_ID: ${{ secrets.APPLE_SERVICE_ID }}
          SOCIAL_TOKEN_ENDPOINT: ${{ secrets.SOCIAL_TOKEN_ENDPOINT }}
        run: |
          if [ -z "$EXPO_TOKEN_RAW" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi

          # 키가 비어 있으면 이번 OTA 가 소셜 버튼을 지운다. 값은 절대
          # 찍지 않고 "있다/없다"만 말한다. 아직 구글을 안 붙인 저장소도
          # 배포는 돼야 하므로 막지는 않고, 대신 크게 경고한다 —
          # 조용히 로그인이 사라지는 것이 제일 나쁘다.
          if [ -z "$GOOGLE_ANDROID_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_ANDROID_CLIENT_ID 시크릿이 비어 있습니다. 이번 OTA 가 설치된 앱에서 [구글로 시작하기] 버튼을 없앱니다. 저장소 Settings → Secrets → Actions 에 넣어 주세요."
            echo "OTA_SOCIAL=없음" >> "$GITHUB_ENV"
          else
            echo "구글 키: 있음 (${#GOOGLE_ANDROID_CLIENT_ID}자) — 소셜 버튼이 유지됩니다."
            echo "OTA_SOCIAL=구글" >> "$GITHUB_ENV"
          fi

          # ⚠️ 붙여넣을 때 줄바꿈이나 공백이 딸려 들어오는 일이 흔하다.
          #    웹에서 토큰을 복사하면 끝에 개행이 붙기 쉽고, 태블릿에서
          #    길게 눌러 선택하면 더 그렇다.
          #
          #    그대로 두면 eas-cli 가 그 값을 HTTP 헤더에 실으려다
          #      *** is not a legal HTTP header value
          #      Error: GraphQL request failed.
          #    로 죽는다. 실제로 이렇게 한 번 막혔다. 토큰이 맞는지
          #    틀린지와 아무 상관 없는 오류라 원인을 찾기가 어렵다.
          #
          #    Expo 토큰에는 공백이 들어갈 일이 없으므로 전부 걷어낸다.
          EXPO_TOKEN="$(printf '%s' "$EXPO_TOKEN_RAW" | tr -d '[:space:]')"
          export EXPO_TOKEN

          # 길이만 확인한다. 값 자체는 절대 찍지 않는다.
          # 잘려서 저장된 토큰은 아래 인증 오류로 가기 전에 여기서 잡는다.
          if [ "${#EXPO_TOKEN}" -lt 20 ]; then
            echo "::error::EXPO_TOKEN 이 너무 짧습니다(${#EXPO_TOKEN}자). 값이 잘려서 저장된 것 같습니다. 시크릿을 지우고 다시 넣어 주세요."
            exit 1
          fi
          if [ "${#EXPO_TOKEN}" -ne "${#EXPO_TOKEN_RAW}" ]; then
            echo "EXPO_TOKEN 에서 공백·줄바꿈을 걷어냈습니다 (${#EXPO_TOKEN_RAW}자 → ${#EXPO_TOKEN}자)."
          fi

          # ⚠️ 엉뚱한 값이 들어 있는 경우. 실제로 한 번 막혔다 —
          #    EXPO_TOKEN 에 2,393자짜리 값이 들어 있었고, eas-cli 는
          #      The bearer token is invalid.
          #    라고만 말했다. Expo 토큰은 수십 자짜리 한 줄이다. 수천 자면
          #    Firebase 서비스 계정 JSON 을 여기에 잘못 넣은 것이다
          #    (그 파일이 딱 그 길이다). 두 시크릿을 태블릿에서 연달아
          #    넣다 보면 생기는 실수라, 여기서 이름을 불러 잡아 준다.
          case "$EXPO_TOKEN" in
            "{"*)
              echo "::error::EXPO_TOKEN 에 JSON 이 들어 있습니다. Firebase 서비스 계정 파일을 여기에 넣은 것 같습니다. EXPO_TOKEN 은 https://expo.dev/settings/access-tokens 에서 만든 한 줄짜리 토큰이어야 합니다. 시크릿을 지우고 다시 넣어 주세요."
              exit 1 ;;
          esac
          if [ "${#EXPO_TOKEN}" -gt 200 ]; then
            echo "::error::EXPO_TOKEN 이 너무 깁니다(${#EXPO_TOKEN}자). Expo 토큰은 수십 자입니다. 다른 값을 넣은 것 같으니 https://expo.dev/settings/access-tokens 에서 새로 만들어 다시 넣어 주세요."
            exit 1
          fi

          # eas-cli 는 버전을 고정하지 않는다. 이 개발 환경에서는 expo.dev
          # 접속이 막혀 있어 특정 버전을 검증할 수 없기 때문이다. 검증하지
          # 않은 버전을 고정하는 것은 최신을 쓰는 것보다 나쁘다.
          npx --yes eas-cli@latest update \
            --branch "$CHANNEL" \
            --message "$(git log -1 --pretty=%s)" \
            --non-interactive

      - name: 결과 요약
        if: always()
        run: |
          st() {
            case "$1" in
              success) echo "✅ 성공" ;;
              failure) echo "❌ 실패" ;;
              skipped|"") echo "— 건너뜀" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "### 배포 결과"
            echo ""
            echo "| 항목 | 결과 |"
            echo "|---|---|"
            # ⚠️ 검증 단계도 표에 넣는다. 예전에는 배포 단계만 봤다.
            #    검증에서 막히면 배포 단계는 전부 "건너뜀"이 되는데,
            #    판정은 "실패한 배포 항목이 없다"고 읽어서 **빨간 실행에
            #    "모두 성공했습니다"** 를 찍었다. 실제로 그랬다.
            #    요약이 실행 결과와 반대로 말하면 아무도 안 믿게 된다.
            echo "| 로직 검증 | $(st '${{ steps.check_logic.outcome }}') |"
            echo "| 보안 규칙 검증 | $(st '${{ steps.check_rules.outcome }}') |"
            echo "| 보안 규칙 | $(st '${{ steps.dep_rules.outcome }}') |"
            echo "| 색인 | $(st '${{ steps.dep_indexes.outcome }}') |"
            echo "| 서버 함수 | $(st '${{ steps.dep_functions.outcome }}') |"
            echo "| OTA ($CHANNEL) | $(st '${{ steps.dep_ota.outcome }}') |"
            echo ""
            # OTA 는 설정(extra)도 갈아친다. 이번 업데이트에 소셜 키가
            # 실렸는지 남겨 둔다 — 버튼이 사라진 뒤에 되짚을 곳이 필요하다.
            if [ -n "$OTA_SOCIAL" ]; then
              echo "OTA 에 실린 소셜 로그인: **$OTA_SOCIAL**"
              if [ "$OTA_SOCIAL" = "없음" ]; then
                echo ""
                echo "> ⚠️ 키가 없어서 이번 업데이트는 설치된 앱의 소셜 로그인 버튼을 없앱니다."
                echo "> 저장소 Settings → Secrets and variables → Actions 에 \`GOOGLE_ANDROID_CLIENT_ID\` 를 넣고 다시 배포하세요."
              fi
              echo ""
            fi
            echo "방식: ${{ github.event_name == 'push' && '푸시 자동 배포' || '버튼(수동)' }}"
            echo ""
            echo "브랜치: \`$DEPLOY_REF\`"
            echo ""
            echo "커밋: \`$(git log -1 --pretty='%h %s')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 하나라도 실패했으면 job 을 실패로 끝낸다.
      # 부분 성공을 초록 체크로 두면, 규칙이 안 올라간 것을 모르고 넘어간다.
      - name: 배포 결과 판정
        if: always()
        run: |
          # ⚠️ 여기서도 `[ 조건 ] && 명령` 을 쓰지 않는다. bash -e 에서
          #    마지막 줄이 거짓이면 그 자체로 실패가 되어, "다 성공했는데
          #    판정 단계가 죽는" 일이 생긴다. 앞서 같은 함정을 한 번 밟았다.
          BAD=""
          # 검증이 막히면 그 아래는 전부 건너뛴다. 그걸 "실패한 항목이
          # 없다"로 읽으면 빨간 실행에 초록 문구가 찍힌다.
          if [ "${{ steps.check_logic.outcome }}" = "failure" ]; then BAD="$BAD 로직검증"; fi
          if [ "${{ steps.check_rules.outcome }}" = "failure" ]; then BAD="$BAD 보안규칙검증"; fi
          if [ "${{ steps.dep_rules.outcome }}" = "failure" ]; then BAD="$BAD 보안규칙"; fi
          if [ "${{ steps.dep_indexes.outcome }}" = "failure" ]; then BAD="$BAD 색인"; fi
          if [ "${{ steps.dep_functions.outcome }}" = "failure" ]; then BAD="$BAD 서버함수"; fi
          if [ "${{ steps.dep_ota.outcome }}" = "failure" ]; then BAD="$BAD OTA"; fi
          if [ -n "$BAD" ]; then
            echo "::error::실패한 항목:$BAD — 위 Summary 를 확인하세요."
            exit 1
          fi
          echo "모두 성공했습니다."
